<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Permisos - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">
        
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main>
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="permissions-header">
            <div id="permissions-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col d-flex align-items-center">
                        <div class="icon-square ms-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-clipboard2-check" viewBox="0 0 16 16">
                                <path d="M9.5 0a.5.5 0 0 1 .5.5.5.5 0 0 0 .5.5.5.5 0 0 1 .5.5V2a.5.5 0 0 1-.5.5h-5A.5.5 0 0 1 5 2v-.5a.5.5 0 0 1 .5-.5.5.5 0 0 0 .5-.5.5.5 0 0 1 .5-.5z"/>
                                <path d="M3 2.5a.5.5 0 0 1 .5-.5H4a.5.5 0 0 0 0-1h-.5A1.5 1.5 0 0 0 2 2.5v12A1.5 1.5 0 0 0 3.5 16h9a1.5 1.5 0 0 0 1.5-1.5v-12A1.5 1.5 0 0 0 12.5 1H12a.5.5 0 0 0 0 1h.5a.5.5 0 0 1 .5.5v12a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5z"/>
                                <path d="M10.854 7.854a.5.5 0 0 0-.708-.708L7.5 9.793 6.354 8.646a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0z"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Permisos de Ausencia</h4>
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end d-none" data-rh-only>
                        <button id="btn-add-permission" class="btn btn-primary d-flex align-items-center ps-3 pe-3 me-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                            </svg>
                            <p class="ps-1">Solicitar Permiso</p>
                        </button>
                        <button id="export-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3 ms-2 me-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-table" viewBox="0 0 16 16">
                                <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm15 2h-4v3h4zm0 4h-4v3h4zm0 4h-4v3h3a1 1 0 0 0 1-1zm-5 3v-3H6v3zm-5 0v-3H1v2a1 1 0 0 0 1 1zm-4-4h4V8H1zm0-4h4V4H1zm5-3v3h4V4zm4 4H6v3h4z"/>
                            </svg>
                            <p class="ps-2">Reporte</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE FORMULARIO PARA AGREGAR REGISTRO -->
        <section id="permissions-form">
            
        </section>

        <!-- SECCIÓN DE FILTROS -->
        <section id="permissions-filter">
            <div class="container pt-3 pb-3">
                <h5>Relación de Permisos</h5>
            </div>
            <div id="permissions-filter-container" class="container pt-4 pb-3">
                <div class="row ms-2 me-2">
                    <div class="col-md-4 col-lg-3 d-flex align-items-center label-over-border">
                        <label for="search-filter" class="form-label m-2">Buscar por empleado</label>    
                        <input id="search-filter" class="form-control" type="search" placeholder="Buscar..." aria-label="Search"/>
                    </div>
                    <div class="col-md-4 col-lg-3 d-flex align-items-center label-over-border">
                        <label for="status-filter" class="form-label m-2">Filtrar por Estatus</label>
                        <select class="form-select" id="status-filter">
                            <option value="0">Todos</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="Aceptado">Aceptado</option>
                            <option value="Rechazado">Rechazado</option>
                        </select>
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end">
                        <button id="filter-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                            <p class="ps-2">Filtrar</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE REGISTROS -->
        <section id="permissions-register">
            <div class="container table-responsive p-0">
                <table id="permissions-table" class="table table-hover align-middle">
                    <thead>
                        <tr class="table-light">
                            <th class="px-1 py-2 text-center">No</th>
                            <th class="px-1 py-2">NOMBRE</th>
                            <th class="px-1 py-2">INGRESO</th>
                            <th class="px-1 py-2">TIPO</th>
                            <th class="px-1 py-2 text-center">DÍAS SOLICITADOS</th>
                            <th class="px-1 py-2 text-center">ESTADO</th>
                            <th class="px-1 py-2">OBSERVACIONES</th>
                            <th class="d-none" data-rh-only></th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>
        </section>

        <!-- SECCIÓN DE PAGINACIÓN -->
        <section id="permissions-pages" class="pb-4">
            <div id="permissions-pages-container" class="container pt-3 pb-3">
                <div class="row ms-2 align-items-center">
                    <div class="col-6 col-lg-9">
                        <p id="permissions-pages-results"></p>
                    </div>
                    <div class="col-6 col-lg-3">
                        <nav aria-label="Page navigation example">
                            <ul class="pagination mb-0">
                                <!-- Los botones se llenan dinámicamente desde JS -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal de edición para cada registro -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16" style="color:var(--primary)">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="edit-modalLabel">Editar registro</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="permissions-edit-form">
                            <input type="hidden" id="edit-id-permission">
                            <input type="hidden" id="edit-id-staff">
                            <input type="hidden" id="edit-requested-dates">
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 ms-auto label-over-border">
                                    <label for="edit-date" class="form-label m-2">Fecha solicitud</label>
                                    <input type="text" class="form-control" id="edit-date" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 col-lg-6 label-over-border">
                                    <label for="edit-staff" class="form-label m-2">Empleado</label>
                                    <input type="text" class="form-control" id="edit-staff" disabled>
                                </div>
                                <div class="col-md-4 col-lg-3 label-over-border">
                                    <label for="edit-antique" class="form-label m-2">Antigüedad</label>
                                    <input type="text" class="form-control" id="edit-antique" disabled>
                                </div>
                                <div class="col-md-4 col-lg-3 label-over-border">
                                    <label for="edit-type" class="form-label m-2">Tipo Permiso</label>
                                    <input type="text" class="form-control" id="edit-type" disabled>
                                </div>
                            </div>
                            <!-- Campos editables -->
                            <div class="row ms-2 me-2 pt-2 pb-3">
                                <div class="col-md-6 ps-4 label-over-border">
                                    <p class="fw-bold">Fechas solicitadas</p>
                                    <ul id="permissions-dates-container">

                                    </ul>
                                </div>
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-status" class="form-label m-2">Estado</label>
                                    <select id="edit-status" class="form-select" aria-label="Default select example">
                                        <option value="0">Seleccione...</option>
                                        <option value="Pendiente">Pendiente</option>
                                        <option value="Aceptado">Aceptado</option>
                                        <option value="Rechazado">Rechazado</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editStatus" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-1 pb-3">
                                <div class="col label-over-border">
                                    <label for="edit-observations" class="form-label m-2">Observaciones</label>
                                    <input type="text" class="form-control" id="edit-observations">
                                    <p class="error invalid-feedback" id="error-editObservations" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="modal-footer me-4">
                    <button id="btn-save" class="btn btn-secondary me-auto ms-4">Generar</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button id="btn-edit-entry" class="btn btn-primary">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación para eliminar registro -->
    <div class="modal fade" id="delete-modal" aria-hidden="true" aria-labelledby="delete-modalLabel" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content pt-3 pb-2">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-circle" viewBox="0 0 16 16" style="color: var(--danger-dark)">
                                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                    <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="delete-modalLabel">Confirmar eliminación</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body m-auto pt-4 pb-4">
                    <input type="hidden" id="delete-id-permission">
                    <p>¿Está seguro de querer eliminar el registro seleccionado?</p>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                    <button id="btn-delete-entry" class="btn btn-primary">Sí</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer id="site-footer">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="/src/js/pages/permissions.js"></script>
</body>
</html>
