<!doctype html>

    <title>Administración de RH - Pallets Alfa</title>

    <!-- BARRA DE RELLENO SUPERIOR -->

    <!-- CONTENEDOR PRINCIPAL -->
    <main>
        <section id="banner" class="mb-5">

            </div>
        </section>

        <!-- SECCIÓN DE RESUMEN -->

                <div id="staff-resume-container" class="row">
                    <div class="col-md-4">
                        <div class="card resume-card mt-2">
                            <div class="card-body d-flex align-items-center">
                                <div class="icon-circle">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">

                                </div>
                                <div class="card-text ms-3">
                                    <p>Personal total</p>
                                    <p id="products-text" class="index-report-cant text-muted">-</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card resume-card mt-2">
                            <div class="card-body d-flex align-items-center">
                                <div class="icon-circle">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-person-check" viewBox="0 0 16 16">

                                    </svg>
                                </div>
                                <div class="card-text ms-3">
                                    <p>Personal activo</p>
                                    <p id="diff-text" class="index-report-cant text-muted">-</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card resume-card mt-2">
                            <div class="card-body d-flex align-items-center">
                                <div class="icon-circle">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-activity" viewBox="0 0 16 16">

                                    <p>Expedientes completados</p>
                                    <p id="rel-text" class="index-report-cant text-muted">-</p>
                                </div>
                            </div>
                        </div>
                    </div>            
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE ENVÍOS -->
        <section id="movements-table">
            <div id="movements-container" class="container pt-3">
                <div class="row ps-3 pe-3 pb-3">
                    <div class="col-6 col-md-9 col-lg-10">

                    </div>
                </div>
                <div id="movements-table-container" class="container table-responsive row justify-content-center p-0">
                    <div class="col-lg-10">
                        <table id="movements-table" class="table table-hover">
                            <thead>
                                <tr class="table-light">
                                    <th class="p-3 ps-4">No</th>
                                    <th class="p-3">NOMBRE</th>
                                    <th class="p-3">PUESTO</th>
                                    <th class="p-3">FECHA NACIMIENTO</th>
                                    <th class="p-3">FECHA INGRESO</th>
                                    <th class="p-3">CALZADO</th>
                                    <th class="p-3">PLAYERA</th>
                                    <th class="p-3">CAMISA</th>
                                    <th class="p-3">PANTALÓN</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

                            <div class="icon-square me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-clipboard-data" viewBox="0 0 16 16">
