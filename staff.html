<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">
        
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="pb-3">
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="staff-header">
            <div id="staff-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col-8 col-md-9 col-lg-10 d-flex align-items-center">
                        <div class="icon-square ms-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Gestión del Personal</h4>
                    </div>
                    <div class="col-4 col-md-3 col-lg-2 d-flex align-items-center">
                        <button id="btn-add-staff" class="btn btn-primary d-flex align-items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                            </svg>
                            <p class="ps-1">Añadir Empleado</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE FORMULARIO PARA AGREGAR REGISTRO -->
        <section id="staff-form">
            
        </section>

        <!-- SECCIÓN PRINCIPAL DE REGISTROS -->
         <section id="staff-register">
            <div id="staff-register-container" class="container">
                <div class="row">
                    <div id="staff-list" class="col-lg-4 pb-3">
                        <div id="staff-list-container">
                            <!-- SECCIÓN DE FILTROS -->
                            <section id="staff-filter">
                                <div class="pt-3 pb-2 ps-4">
                                    <h5 class="ps-2">Listado de Empleados</h5>
                                </div>
                                <div id="staff-filter-container" class="container pt-4 pb-1">
                                    <div class="row ms-2 me-2">
                                        <div class="col-md-6 col-lg-12 d-flex align-items-center label-over-border">
                                            <label for="search-filter" class="form-label m-2">Buscar por empleado</label>    
                                            <input id="search-filter" class="form-control" type="search" placeholder="Buscar por No / Nombre" aria-label="Search"/>
                                        </div>
                                        <div class="col-md-6 col-lg-12 d-flex align-items-center label-over-border">
                                            <label for="status-filter" class="form-label m-2">Filtrar por Estatus</label>
                                            <select class="form-select" id="status-filter">
                                                <option value="0">Todos</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </section>
                            <hr>

                            <!-- LISTA DE EMPLEADOS -->
                            <section id="staff">
                                <div id="staff-container" class="container pt-2 pb-4">
                                    <div class="list-group ">
                                        <button type="button" class="list-group-item list-group-item-action">
                                            <div class="employee">
                                                <p class="staff-name">Juan Pérez</p>
                                                <p class="staff-id">No. 0001</p>
                                            </div>
                                        </button>
                                        <button type="button" class="list-group-item list-group-item-action">
                                            <div class="employee">
                                                <p class="staff-name">María López</p>
                                                <p class="staff-id">No. 0002</p>
                                            </div>
                                        </button>
                                        <button type="button" class="list-group-item list-group-item-action">
                                            <div class="employee">
                                                <p class="staff-name">Carlos Ramírez</p>
                                                <p class="staff-id">No. 0003</p>
                                            </div>
                                        </button>
                                        <button type="button" class="list-group-item list-group-item-action">
                                            <div class="employee">
                                                <p class="staff-name">Ana Suárez</p>
                                                <p class="staff-id">No. 0004</p>
                                            </div>
                                        </button>
                                        <button type="button" class="list-group-item list-group-item-action">
                                            <div class="employee">
                                                <p class="staff-name">Luis Fernández</p>
                                                <p class="staff-id">No. 0005</p>
                                            </div>
                                        </button>
                                        <button type="button" class="list-group-item list-group-item-action">
                                            <div class="employee">
                                                <p class="staff-name">Sofía Martínez</p>
                                                <p class="staff-id">No. 0006</p>
                                            </div>
                                        </button>
                                        <button type="button" class="list-group-item list-group-item-action">
                                            <div class="employee">
                                                <p class="staff-name">Diego Navarro</p>
                                                <p class="staff-id">No. 0007</p>
                                            </div>
                                        </button>

                                        <button type="button" class="list-group-item list-group-item-action">
                                            <div class="employee">
                                                <p class="staff-name">Valeria Campos</p>
                                                <p class="staff-id">No. 0008</p>
                                            </div>
                                        </button>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                    <div id="staff-info" class="col-lg-8 pb-3">
                        <div id="staff-info-container" class="container">
                            <div class="pt-3 pb-3">
                                <h5 class="ps-2">Información del Empleado</h5>
                            </div>
                            <form id="staff-form" class="pb-4">
                                <input type="hidden" id="hidden-id-staff">
                                <!-- Campos bles -->
                                 <div class="row ms-2 me-2 pb-1">
                                    <div class="col-md-3">
                                        <label for="id-staff" class="form-label fw-semibold m-2">No Empleado</label>
                                        <input type="text" class="form-control" id="id-staff" placeholder="0000">
                                        <p class="error invalid-feedback" id="error-id-staff" style="color: red;"></p>
                                    </div>
                                </div>
                                <p class="staff-title ms-4 fst-italic">Datos generales</p>
                                <div class="row ms-2 me-2">
                                    <div class="col-md-8">
                                        <label for="name" class="form-label fw-semibold m-2">Nombre</label>
                                        <input type="text" class="form-control" id="name" placeholder="Nombre y Apellidos">
                                        <p class="error invalid-feedback" id="error-name" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="departament" class="form-label fw-semibold m-2">Puesto</label>
                                        <input type="text" class="form-control" id="departament" placeholder="Puesto / Departamento">
                                        <p class="error invalid-feedback" id="error-departament" style="color: red;"></p>
                                    </div>
                                </div>
                                <div class="row ms-2 me-2">
                                    <div class="col-md-4">
                                        <label for="birth" class="form-label fw-semibold m-2">Fecha nacimiento</label>
                                        <input type="text" class="form-control" id="birth" placeholder="AAAA-MM-DD">
                                        <p class="error invalid-feedback" id="error-birth" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="phone" class="form-label fw-semibold m-2">Teléfono</label>
                                        <input type="number" class="form-control no-arrows" id="phone" placeholder="5510203040">
                                        <p class="error invalid-feedback" id="error-phone" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="entry" class="form-label fw-semibold m-2">Fecha ingreso</label>
                                        <input type="text" class="form-control" id="entry" placeholder="AAAA-MM-DD">
                                        <p class="error invalid-feedback" id="error-entry" style="color: red;"></p>
                                    </div>
                                </div>
                                <div class="row ms-2 me-2">
                                    <div class="col-md-3">
                                        <label for="nss" class="form-label fw-semibold m-2">NSS</label>
                                        <input type="number" class="form-control no-arrows" id="nss" placeholder="01234567891">
                                        <p class="error invalid-feedback" id="error-nss" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="rfc" class="form-label fw-semibold m-2">RFC</label>
                                        <input type="text" class="form-control" id="rfc" placeholder="RFCX000000YY">
                                        <p class="error invalid-feedback" id="error-rfc" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="curp" class="form-label fw-semibold m-2">CURP</label>
                                        <input type="text" class="form-control" id="curp" placeholder="CURP000000AABBCC00">
                                        <p class="error invalid-feedback" id="error-curp" style="color: red;"></p>
                                    </div>
                                </div>
                                <div class="row ms-2 me-2 pb-3">
                                    <div class="col-md-8">
                                        <label for="direction" class="form-label fw-semibold m-2">Dirección</label>
                                        <input type="text" class="form-control" id="direction" placeholder="Dirección completa">
                                        <p class="error invalid-feedback" id="error-direction" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="status" class="form-label fw-semibold m-2">Estatus</label>
                                        <select id="status" class="form-select" aria-label="Default select example">
                                            <option value="0">Seleccione...</option>
                                            <option value="Activo">Activo</option>
                                            <option value="Inactivo">Inactivo </option>
                                        </select>
                                        <p class="error invalid-feedback" id="error-status" style="color: red;"></p>
                                    </div>
                                </div>
                                <p class="staff-title ms-4 fst-italic">Datos de emergencia</p>
                                <div class="row ms-2 me-2 pb-3">
                                    <div class="col-md-6">
                                        <label for="em-name" class="form-label fw-semibold m-2">Nombre</label>
                                        <input type="text" class="form-control" id="em-name" placeholder="Nombre del contacto">
                                        <p class="error invalid-feedback" id="error-em-name" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="em-relation" class="form-label fw-semibold m-2">Parentesco</label>
                                        <input type="text" class="form-control" id="em-relation" placeholder="Parentesco de la persona">
                                        <p class="error invalid-feedback" id="error-em-relation" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="em-phone" class="form-label fw-semibold m-2">Teléfono</label>
                                        <input type="number" class="form-control no-arrows" id="em-phone" placeholder="Teléfono de emergencia">
                                        <p class="error invalid-feedback" id="error-em-phone" style="color: red;"></p>
                                    </div>
                                </div>
                                <p class="staff-title ms-4 fst-italic">Datos de salud</p>
                                <div class="row ms-2 me-2 pb-3">
                                    <div class="col-md-3">
                                        <label for="type" class="form-label fw-semibold m-2">Tipo sangre</label>
                                        <input type="text" class="form-control" id="type" placeholder="(Opcional)">
                                        <p class="error invalid-feedback" id="error-type" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="illness" class="form-label fw-semibold m-2">Enfermedad</label>
                                        <input type="text" class="form-control" id="illness" placeholder="(Opcional)">
                                        <p class="error invalid-feedback" id="error-illness" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="medicament" class="form-label fw-semibold m-2">Medicamento</label>
                                        <input type="text" class="form-control" id="medicament" placeholder="(Opcional)">
                                        <p class="error invalid-feedback" id="error-medicament" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="allergy" class="form-label fw-semibold m-2">Alergia</label>
                                        <input type="text" class="form-control" id="allergy" placeholder="(Opcional)">
                                        <p class="error invalid-feedback" id="error-allergy" style="color: red;"></p>
                                    </div>
                                </div>
                                <p class="staff-title ms-4 fst-italic">Datos de uniforme</p>
                                <div class="row ms-2 me-2">
                                    <div class="col-md-3">
                                        <label for="boots" class="form-label fw-semibold m-2">Calzado</label>
                                        <input type="number" class="form-control no-arrows" id="boots" placeholder="Talla de calzado">
                                        <p class="error invalid-feedback" id="error-boots" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="tshirt" class="form-label fw-semibold m-2">Playera</label>
                                        <input type="text" class="form-control" id="tshirt" placeholder="Talla de playera">
                                        <p class="error invalid-feedback" id="error-tshirt" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="shirt" class="form-label fw-semibold m-2">Camisa</label>
                                        <input type="text" class="form-control" id="shirt" placeholder="Talla de camisa">
                                        <p class="error invalid-feedback" id="error-shirt" style="color: red;"></p>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="pants" class="form-label fw-semibold m-2">Pantalón</label>
                                        <input type="text" class="form-control" id="pants" placeholder="Talla de pantalón">
                                        <p class="error invalid-feedback" id="error-pants" style="color: red;"></p>
                                    </div>
                                </div>
                            </form>
                            <div class="form-buttons d-flex justify-content-end pb-4 me-3">
                                <button class="btn btn-danger m-1" data-bs-target="#delete-modal" data-bs-toggle="modal">Eliminar registro</button>
                                <button id="btn-edit-entry" class="btn btn-primary m-1">Guardar cambios</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
         </section>
    </main>

    <!-- Modal de confirmación para eliminar registro -->
    <div class="modal fade" id="delete-modal" aria-hidden="true" aria-labelledby="delete-modalLabel" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content pt-3 pb-2">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-circle" viewBox="0 0 16 16" style="color: var(--danger-dark)">
                                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                    <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="delete-modalLabel">Confirmar eliminación</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body m-auto pt-4 pb-4">
                    <input type="hidden" id="delete-id-staff">
                    <p>¿Está seguro de querer eliminar el registro seleccionado?</p>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                    <button id="btn-delete-entry" class="btn btn-primary">Sí</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer id="site-footer">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/src/js/pages/staff.js"></script>
</body>
</html>
