<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">
        
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="pb-3">
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="staff-header">
            <div id="staff-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col d-flex align-items-center">
                        <div class="icon-square ms-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Gestión del Personal</h4>
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end d-none" data-rh-only data-dir-only>
                        <button id="btn-add-staff" class="btn btn-primary d-flex align-items-center ps-3 pe-3 me-2 d-none" data-rh-only>
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                            </svg>
                            <p class="ps-1">Nuevo Empleado</p>
                        </button>
                        <button id="export-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3 ms-2 me-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-table" viewBox="0 0 16 16">
                                <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm15 2h-4v3h4zm0 4h-4v3h4zm0 4h-4v3h3a1 1 0 0 0 1-1zm-5 3v-3H6v3zm-5 0v-3H1v2a1 1 0 0 0 1 1zm-4-4h4V8H1zm0-4h4V4H1zm5-3v3h4V4zm4 4H6v3h4z"/>
                            </svg>
                            <p class="ps-2">Reporte</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN PRINCIPAL DE REGISTROS -->
        <section id="staff-cardex">
            <div id="staff-cardex-container" class="container">
                <div class="row">
                    <div id="staff-register" class="col-lg-4 pb-3">
                        <div id="staff-register-container">
                            <!-- SECCIÓN DE FILTROS -->
                            <section id="staff-filter">
                                <div class="pt-3 pb-2 ps-4">
                                    <h5 class="ps-2">Listado de Empleados</h5>
                                </div>
                                <div id="staff-filter-container" class="container pt-4 pb-1">
                                    <div class="row ms-2 me-2">
                                        <div class="col-md col-lg-12 d-flex align-items-center label-over-border">
                                            <label for="search-filter" class="form-label m-2">Buscar por empleado</label>    
                                            <input id="search-filter" class="form-control" type="search" placeholder="Buscar por No / Nombre" aria-label="Search" autocomplete="off"/>
                                        </div>
                                        <div class="col-md col-lg-12 d-flex align-items-center label-over-border">
                                            <label for="status-filter" class="form-label m-2">Filtrar por Estatus</label>
                                            <select class="form-select" id="status-filter">
                                                <option value="0">Todos</option>
                                                <option value="Activo" selected>Activos</option>
                                                <option value="Inactivo">Inactivos</option>
                                                <option value="Pendiente">Pendientes</option>
                                            </select>
                                        </div>
                                        <div id="filter-btn-container" class="col-md d-flex align-items-center justify-content-end">
                                            <button id="filter-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                                                </svg>
                                                <p class="ps-2">Filtrar</p>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </section>
                            <hr>

                            <!-- LISTA DE EMPLEADOS -->
                            <section id="staff">
                                <div id="staff-container" class="container pt-2 pb-4">
                                    <div id="staff-list" class="list-group">
                                        <p>No hay registros que mostrar.</p>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                    <div id="staff-info" class="col-lg-8 pb-3">
                        <div id="staff-info-container" class="container d-flex justify-content-center align-items-center p-5">
                            <div id="logo-info" class="text-center">
                                <h5 class="fw-light mb-4">Seleccione un empleado para visualizar su información.</h5>
                                <img src="/assets/images/logo-letras-420x187.png" alt="Logo Pallets Alfa" class="w-75 img-fluid">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal para dar de baja un empleado -->
    <div class="modal fade" id="remove-modal" aria-hidden="true" aria-labelledby="remove-modalLabel" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-2">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-circle" viewBox="0 0 16 16" style="color: var(--danger-dark)">
                                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                    <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="remove-modalLabel">Información de la Baja</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="remove-staff-form">
                            <div class="row ms-2 me-2 mt-4">
                                <div class="col-md-9 col-lg-4 label-over-border">
                                    <label for="remove-motive" class="form-label m-2">Motivo de Salida</label>
                                    <select class="form-select" id="remove-motive">
                                        <option value="0">Seleccione...</option>
                                        <option value="Sueldo">Sueldo y Prestaciones</option>
                                        <option value="Ambiente">Ambiente laboral</option>
                                        <option value="Acoso">Acoso o Bullyng</option>
                                        <option value="Condiciones">Condiciones de trabajo</option>
                                        <option value="Capacitacion">Capacitación del puesto</option>
                                        <option value="Personal">Motivos personales</option>
                                        <option value="Otro">Otro</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-remove-motive" style="color: red;"></p>
                                </div>
                                <div class="col-md-12 col-lg-8 label-over-border">
                                    <label for="remove-description" class="form-label m-2">Descripción</label>
                                    <textarea id="remove-description" class="form-control" rows="4" placeholder="Describa a detalle el motivo de salida del colaborador."></textarea>
                                    <p class="error invalid-feedback" id="error-remove-description" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button id="btn-remove-staff" class="btn btn-danger">Dar de Baja</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer id="site-footer">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/js/pages/staff.js"></script>
</body>
</html>
